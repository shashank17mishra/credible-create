<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments Log — Credible Create Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-container">
    <div id="admin-sidebar-wrap"></div>

    <div class="admin-viewport">
                                                          <header class="admin-header">
        <div class="header-title-sec" style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-mobile-menu-btn" class="admin-mobile-toggle" aria-label="Toggle Navigation Sidebar" style="display: none; background: transparent; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.5rem; cursor: pointer; color: #0f172a;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h2>Control Center</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <span class="header-status-badge">SYS.STATUS // LIVE</span>
          <a href="/index.html" target="_blank" class="btn-view-site" style="font-size: 0.75rem; text-decoration: none; color: #0f172a; border: 1px solid #cbd5e1; padding: 0.45rem 0.85rem; border-radius: 6px; font-weight: 600; background: #fff; display: flex; align-items: center; gap: 0.35rem;">
            <span>View Website</span>
            <span>↗</span>
          </a>
        </div>
      </header>

      <main class="admin-content">
        <div class="workspace-header">
          <div class="workspace-title">
            <h1>Processed Transactions Registry</h1>
            <p>View student cohort invoices and Razorpay gateway tracking details</p>
          </div>
        </div>

        <div id="toast-container"></div>

        <div class="glass-panel table-panel" style="padding: 1.5rem;">
          <h3 class="form-section-title" style="margin-top: 0; padding-left: 0.5rem;">
            <span style="color: var(--admin-cyber-purple);">✦</span> Cohort Invoices & Gateways
          </h3>
          <div id="payments-table-wrap">
            <div style="text-align: center; padding: 4rem 0; color: var(--admin-text-muted);">
              <span style="font-family: var(--font-mono); font-size: 0.9rem;">[ LOADING TRANSACTIONS TELEMETRY // LOADING ]</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/admin-layout.js"></script>
  <script>
    async function loadPayments() {
      const wrap = document.getElementById('payments-table-wrap');
      try {
        const res = await fetch('/api/admin/payments');
        if (!res.ok) throw new Error('Failed to retrieve payments log');
        const payments = await res.json();

        if (payments.length === 0) {
          wrap.innerHTML = `<div style="padding: 3rem 1.5rem; text-align: center; color: var(--admin-text-muted);">No payment invoices recorded.</div>`;
          return;
        }

        let rows = '';
        payments.forEach(pay => {
          const formattedAmount = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: pay.currency || 'INR',
            maximumFractionDigits: 0
          }).format(pay.amount);

          const dateStr = new Date(pay.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

          rows += `
            <tr>
              <td>
                <div style="font-weight: 600;">${pay.user?.name || 'Student Customer'}</div>
                <div style="font-size: 0.75rem; color: var(--admin-text-muted);">${pay.user?.email || 'N/A'}</div>
              </td>
              <td style="font-family: var(--font-mono); font-weight: 700; color: var(--admin-cyber-amber);">
                ${formattedAmount}
              </td>
              <td>
                <span class="status-pill ${pay.status === 'SUCCESS' ? 'success' : pay.status === 'PENDING' ? 'warning' : 'danger'}">
                  ${pay.status}
                </span>
              </td>
              <td style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--admin-text-muted);">
                Order: ${pay.razorpayOrderId || 'N/A'}<br>
                Pay: ${pay.razorpayPaymentId || 'N/A'}
              </td>
              <td style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--admin-text-muted);">
                ${dateStr}
              </td>
            </tr>
          `;
        });

        wrap.innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>Customer / Student</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Gateway Identifiers</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      } catch (err) {
        wrap.innerHTML = `<div class="login-error" style="padding: 2rem;">[ ERROR // ${err.message.toUpperCase()} ]</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAdminPage(() => {
        loadPayments();
      });
    });
  </script>
                
</body>
</html>
