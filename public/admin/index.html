<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Credible Create</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-container">
    <div id="admin-sidebar-wrap"></div>

    <div class="admin-viewport">
                                                          <header class="admin-header">
        <div class="header-title-sec" style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-mobile-menu-btn" class="admin-mobile-toggle" aria-label="Toggle Navigation Sidebar" style="display: none; background: transparent; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.5rem; cursor: pointer; color: #0f172a;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h2>Control Center</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <span class="header-status-badge">SYS.STATUS // LIVE</span>
          <a href="/index.html" target="_blank" class="btn-view-site" style="font-size: 0.75rem; text-decoration: none; color: #0f172a; border: 1px solid #cbd5e1; padding: 0.45rem 0.85rem; border-radius: 6px; font-weight: 600; background: #fff; display: flex; align-items: center; gap: 0.35rem;">
            <span>View Website</span>
            <span>↗</span>
          </a>
        </div>
      </header>

      <main class="admin-content">
        <div class="workspace-header">
          <div class="workspace-title">
            <h1>Control Center Overview</h1>
            <p>Real-time analytics and system diagnostic telemetry</p>
          </div>
          <div style="display: flex; gap: 1rem;">
            <button onclick="window.location.reload()" class="admin-btn admin-btn-secondary" style="font-size: 0.8rem; padding: 0.5rem 1rem;">
              Refresh Diagnostics
            </button>
          </div>
        </div>

        <div id="dashboard-content">
          <div style="text-align: center; padding: 5rem 0; color: var(--admin-text-muted);">
            <span style="font-family: var(--font-mono); font-size: 0.9rem;">[ DETECTING CORE METRICS // LOADING ]</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    async function loadDashboardMetrics() {
      const container = document.getElementById('dashboard-content');
      try {
        let stats = {
          postsCount: 0,
          certificatesCount: 0,
          usersCount: 0,
          paymentsCount: 0,
          paymentsTotal: 0,
          recentLogs: []
        };

        const start = Date.now();
        let latency = 12;

        try {
          const res = await fetch('/api/admin/stats');
          if (res.ok) {
            stats = await res.json();
            latency = Date.now() - start;
          }
        } catch (apiErr) {
          if (window.CredibleDB && window.CredibleDB.client) {
            try {
              const [posts, certs, users, payments] = await Promise.all([
                window.CredibleDB.getAllPosts(),
                window.CredibleDB.getCertificates(),
                window.CredibleDB.client.from('profiles').select('*', { count: 'exact' }),
                window.CredibleDB.client.from('payments').select('*')
              ]);

              if (posts) stats.postsCount = posts.length;
              if (certs) stats.certificatesCount = certs.length;
              if (users && users.data) stats.usersCount = users.data.length;
              if (payments && payments.data) {
                stats.paymentsCount = payments.data.length;
                stats.paymentsTotal = payments.data.reduce((acc, p) => acc + (parseFloat(p.amount) || 0), 0);
              }
              latency = Date.now() - start;
            } catch (sbErr) {
              console.warn("Supabase metrics fallback:", sbErr);
            }
          }
        }

        let studentsCount = 0;
        try {
          const stHeaders = typeof getAdminAuthHeaders === 'function' ? getAdminAuthHeaders() : {};
          const stRes = await fetch('/api/admin/students', { headers: stHeaders });
          if (stRes.ok) {
            const stData = await stRes.json();
            if (stData.students && Array.isArray(stData.students)) {
              studentsCount = stData.students.length;
            }
          }
        } catch (stErr) {
          console.warn("Students count fetch warning:", stErr);
        }

        const formattedPayments = new Intl.NumberFormat('en-IN', {
          style: 'currency',
          currency: 'INR',
          maximumFractionDigits: 0
        }).format(stats.paymentsTotal || 0);

        let logsHtml = '';
        if (!stats.recentLogs || stats.recentLogs.length === 0) {
          logsHtml = `<div style="color: var(--admin-text-muted); font-size: 0.85rem; font-style: italic;">No recent administrative transactions registered.</div>`;
        } else {
          stats.recentLogs.forEach(log => {
            const timeStr = new Date(log.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            logsHtml += `
              <div class="log-entry">
                <span class="log-meta">[${log.type}]</span>
                <span class="log-desc">${log.description}</span>
                <span class="log-time">${timeStr}</span>
              </div>
            `;
          });
        }

        container.innerHTML = `
          <div class="metrics-grid">
            <a href="/admin/students.html" style="text-decoration: none; color: inherit;">
              <div class="metric-card glass-panel" style="transition: transform 0.2s ease; cursor: pointer;">
                <div class="metric-header">
                  <span class="metric-title">Student Leads (Sheet)</span>
                  <div class="metric-icon-box cyan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                      <circle cx="9" cy="7" r="4" />
                    </svg>
                  </div>
                </div>
                <div class="metric-value">${studentsCount}</div>
                <div class="metric-subtitle">Google Sheet Synced Data ↗</div>
              </div>
            </a>

            <div class="metric-card glass-panel">
              <div class="metric-header">
                <span class="metric-title">Content Engine</span>
                <div class="metric-icon-box indigo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                  </svg>
                </div>
              </div>
              <div class="metric-value">${stats.postsCount}</div>
              <div class="metric-subtitle">Total Composed Articles</div>
            </div>

            <div class="metric-card glass-panel">
              <div class="metric-header">
                <span class="metric-title">Verified Achievements</span>
                <div class="metric-icon-box cyan">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                  </svg>
                </div>
              </div>
              <div class="metric-value">${stats.certificatesCount}</div>
              <div class="metric-subtitle">Issued Certificate Hashes</div>
            </div>

            <div class="metric-card glass-panel">
              <div class="metric-header">
                <span class="metric-title">Secured Registers</span>
                <div class="metric-icon-box purple">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                  </svg>
                </div>
              </div>
              <div class="metric-value">${stats.usersCount}</div>
              <div class="metric-subtitle">Active Credentials</div>
            </div>

            <div class="metric-card glass-panel">
              <div class="metric-header">
                <span class="metric-title">Processed Transactions</span>
                <div class="metric-icon-box amber">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                    <line x1="12" y1="1" x2="12" y2="23" />
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                  </svg>
                </div>
              </div>
              <div class="metric-value">${formattedPayments}</div>
              <div class="metric-subtitle">${stats.paymentsCount} Total Invoices</div>
            </div>
          </div>

          <div class="dashboard-details-grid">
            <div class="system-logs-box glass-panel">
              <h3 class="form-section-title" style="margin-top: 0;">
                <span style="color: var(--admin-cyber-indigo);">✦</span> System Operations Log
              </h3>
              <div style="margin-top: 1rem;">
                ${logsHtml}
              </div>
            </div>

            <div class="system-logs-box glass-panel">
              <h3 class="form-section-title" style="margin-top: 0;">
                <span style="color: var(--admin-cyber-cyan);">✦</span> Diagnostic Feeds
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1.5rem;">
                <div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.25rem;">
                    <span style="color: var(--admin-text-muted);">SQLITE ENGINE</span>
                    <span class="status-pill success" style="padding: 0.1rem 0.4rem; font-size: 0.6rem;">ONLINE</span>
                  </div>
                  <div style="height: 4px; background: rgba(0,0,0,0.05); border-radius: 2px; overflow: hidden;">
                    <div style="height: 100%; width: 100%; background: #10b981;"></div>
                  </div>
                </div>

                <div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.25rem;">
                    <span style="color: var(--admin-text-muted);">API RESPONSE TIME</span>
                    <span style="font-family: var(--font-mono); font-size: 0.75rem; color: #10b981;">${latency} ms</span>
                  </div>
                  <div style="height: 4px; background: rgba(0,0,0,0.05); border-radius: 2px; overflow: hidden;">
                    <div style="height: 100%; width: 95%; background: #10b981;"></div>
                  </div>
                </div>

                <div style="border-top: 1px solid var(--admin-border-glass); padding-top: 1rem; margin-top: 0.5rem;">
                  <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--admin-text-muted); margin-bottom: 0.5rem;">
                    <span>AETHER ROUTING</span>
                    <span style="font-family: var(--font-mono); color: var(--admin-cyber-cyan);">OK // EXPRESS SERVER</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--admin-text-muted);">
                    <span>SESSION ROLE</span>
                    <span style="font-family: var(--font-mono); color: var(--admin-cyber-purple);">GRANTED</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="login-error" style="padding: 2rem;">[ DIAGNOSTIC EXCEPTION // ${err.message.toUpperCase()} ]</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAdminPage(() => {
        loadDashboardMetrics();
      });
    });
  </script>
                
</body>
</html>
