<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts Manager — Credible Create Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-container">
    <div id="admin-sidebar-wrap"></div>

    <div class="admin-viewport">
                                                          <header class="admin-header">
        <div class="header-title-sec" style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-mobile-menu-btn" class="admin-mobile-toggle" aria-label="Toggle Navigation Sidebar" style="display: none; background: transparent; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.5rem; cursor: pointer; color: #0f172a;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h2>Control Center</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <span class="header-status-badge">SYS.STATUS // LIVE</span>
          <a href="/index.html" target="_blank" class="btn-view-site" style="font-size: 0.75rem; text-decoration: none; color: #0f172a; border: 1px solid #cbd5e1; padding: 0.45rem 0.85rem; border-radius: 6px; font-weight: 600; background: #fff; display: flex; align-items: center; gap: 0.35rem;">
            <span>View Website</span>
            <span>↗</span>
          </a>
        </div>
      </header>

      <main class="admin-content">
        <div class="workspace-header">
          <div class="workspace-title">
            <h1>Blog Publications Engine</h1>
            <p>Manage, compose, publish, and edit research articles</p>
          </div>
          <div>
            <a href="/admin-post-edit.html" class="admin-btn admin-btn-primary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;">
              + Create New Publication
            </a>
          </div>
        </div>

        <div id="toast-container"></div>

        <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 2rem;">
          <input type="text" id="search-input" class="admin-input" placeholder="Search publications by title or slug..." style="padding: 0.6rem 1rem;" />
        </div>

        <div class="glass-panel table-panel" style="padding: 1.5rem;">
          <h3 class="form-section-title" style="margin-top: 0; padding-left: 0.5rem;">
            <span style="color: var(--admin-cyber-indigo);">✦</span> Published & Draft Articles
          </h3>
          <div id="posts-table-wrap">
            <div style="text-align: center; padding: 4rem 0; color: var(--admin-text-muted);">
              <span style="font-family: var(--font-mono); font-size: 0.9rem;">[ RETRIEVING POST ARCHIVES // LOADING ]</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/admin-layout.js"></script>
  <script>
    let allPosts = [];
    let currentUserRole = 'SUB_ADMIN';

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = `
        <div class="toast-msg ${type}">
          <span style="font-family: var(--font-mono)">
            [ ${type === 'error' ? 'FAIL' : 'OK'} // ${message.toUpperCase()} ]
          </span>
        </div>
      `;
      setTimeout(() => { container.innerHTML = ''; }, 3000);
    }

    function renderPostsTable(filterQuery = '') {
      const wrap = document.getElementById('posts-table-wrap');
      if (!wrap) return;

      let filtered = allPosts;
      if (filterQuery.trim() !== '') {
        const q = filterQuery.toLowerCase();
        filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q));
      }

      if (filtered.length === 0) {
        wrap.innerHTML = `<div style="padding: 3rem 1.5rem; text-align: center; color: var(--admin-text-muted);">No blog posts found matching your search.</div>`;
        return;
      }

      let rows = '';
      filtered.forEach(post => {
        const isPublished = post.status === 'PUBLISHED';
        const dateStr = new Date(post.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        rows += `
          <tr>
            <td>
              <div style="font-weight: 600;">${post.title}</div>
              <div style="font-size: 0.75rem; color: var(--admin-text-muted); font-family: var(--font-mono);">/${post.slug}</div>
            </td>
            <td>
              <span class="status-pill ${isPublished ? 'success' : 'warning'}">
                ${post.status}
              </span>
            </td>
            <td style="font-size: 0.85rem; color: var(--admin-text-muted);">
              ${post.author?.name || 'Author'}
            </td>
            <td style="font-size: 0.8rem; font-family: var(--font-mono); color: var(--admin-text-muted);">
              ${dateStr}
            </td>
            <td style="text-align: right;">
              <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <a href="/admin-post-edit.html?id=${post.id}" class="admin-btn admin-btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">
                  Edit
                </a>
                <button onclick="deletePost('${post.id}', '${post.title.replace(/'/g, "\\'")}')" class="admin-btn admin-btn-danger" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      wrap.innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>Publication Details</th>
              <th>Status</th>
              <th>Author</th>
              <th>Date</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    async function deletePost(id, title) {
      if (!confirm(`Are you sure you want to delete post "${title}"?`)) return;

      try {
        const res = await fetch(`/api/admin/posts/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Failed to delete post');
        }
        allPosts = allPosts.filter(p => p.id !== id);
        renderPostsTable();
        showToast('Publication successfully deleted', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadPosts() {
      try {
        const res = await fetch('/api/admin/posts');
        if (!res.ok) throw new Error('Failed to load posts');
        allPosts = await res.json();
        renderPostsTable();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAdminPage((user) => {
        currentUserRole = user.role;
        loadPosts();

        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            renderPostsTable(e.target.value);
          });
        }
      });
    });
  </script>
                
</body>
</html>
