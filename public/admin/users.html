<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users & Admins — Credible Create Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-container">
    <div id="admin-sidebar-wrap"></div>

    <div class="admin-viewport">
                                                          <header class="admin-header">
        <div class="header-title-sec" style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-mobile-menu-btn" class="admin-mobile-toggle" aria-label="Toggle Navigation Sidebar" style="display: none; background: transparent; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.5rem; cursor: pointer; color: #0f172a;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h2>Control Center</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <span class="header-status-badge">SYS.STATUS // LIVE</span>
          <a href="/index.html" target="_blank" class="btn-view-site" style="font-size: 0.75rem; text-decoration: none; color: #0f172a; border: 1px solid #cbd5e1; padding: 0.45rem 0.85rem; border-radius: 6px; font-weight: 600; background: #fff; display: flex; align-items: center; gap: 0.35rem;">
            <span>View Website</span>
            <span>↗</span>
          </a>
        </div>
      </header>

      <main class="admin-content">
        <div class="workspace-header">
          <div class="workspace-title">
            <h1>User & Sub-Admin Control</h1>
            <p>Assign administrative access privileges and manage security tokens</p>
          </div>
          <div>
            <button onclick="toggleAddModal(true)" class="admin-btn admin-btn-primary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;">
              + Provision New Sub-Admin
            </button>
          </div>
        </div>

        <div id="toast-container"></div>

        <div class="glass-panel table-panel" style="padding: 1.5rem;">
          <h3 class="form-section-title" style="margin-top: 0; padding-left: 0.5rem;">
            <span style="color: var(--admin-cyber-indigo);">✦</span> Active Credentials & Access Matrix
          </h3>
          <div id="users-table-wrap">
            <div style="text-align: center; padding: 4rem 0; color: var(--admin-text-muted);">
              <span style="font-family: var(--font-mono); font-size: 0.9rem;">[ DETECTING SYSTEM USERS // LOADING ]</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add User Modal -->
  <div id="add-user-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="glass-panel" style="max-width: 500px; width: 100%; padding: 2rem; background: #ffffff;">
      <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: #121212;">Provision New Sub-Admin</h3>
      <form id="add-user-form">
        <div class="admin-form-group">
          <label class="admin-label">Full Name</label>
          <input type="text" id="add-name" class="admin-input" required placeholder="e.g. Alex Rivera" />
        </div>
        <div class="admin-form-group">
          <label class="admin-label">Email Address</label>
          <input type="email" id="add-email" class="admin-input" required placeholder="alex@crediblecreate.com" />
        </div>
        <div class="admin-form-group">
          <label class="admin-label">Password</label>
          <input type="password" id="add-password" class="admin-input" required placeholder="••••••••" />
        </div>
        <div class="admin-form-group">
          <label class="admin-label">Role</label>
          <select id="add-role" class="admin-select">
            <option value="SUB_ADMIN">SUB_ADMIN</option>
            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
          </select>
        </div>

        <span class="admin-label" style="display: block; margin-top: 1rem; margin-bottom: 0.5rem;">Permission Flags</span>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
            <input type="checkbox" id="add-posts" checked /> Manage Blog Posts
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
            <input type="checkbox" id="add-certs" checked /> Manage Certificates
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
            <input type="checkbox" id="add-payments" /> View Payments Log
          </label>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
          <button type="button" onclick="toggleAddModal(false)" class="admin-btn admin-btn-secondary">Cancel</button>
          <button type="submit" class="admin-btn admin-btn-primary">Provision Credentials</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin-layout.js"></script>
  <script>
    let usersList = [];
    let currentUserId = '';

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = `
        <div class="toast-msg ${type}">
          <span style="font-family: var(--font-mono)">
            [ ${type === 'error' ? 'FAIL' : 'OK'} // ${message.toUpperCase()} ]
          </span>
        </div>
      `;
      setTimeout(() => { container.innerHTML = ''; }, 3000);
    }

    function toggleAddModal(show) {
      document.getElementById('add-user-modal').style.display = show ? 'flex' : 'none';
    }

    function renderUsersTable() {
      const wrap = document.getElementById('users-table-wrap');
      if (!wrap) return;

      if (usersList.length === 0) {
        wrap.innerHTML = `<div style="padding: 3rem 1.5rem; text-align: center; color: var(--admin-text-muted);">No users found in database.</div>`;
        return;
      }

      let rows = '';
      usersList.forEach(u => {
        const isSuper = u.role === 'SUPER_ADMIN';
        rows += `
          <tr>
            <td>
              <div style="font-weight: 600;">${u.name || 'User'}</div>
              <div style="font-size: 0.75rem; color: var(--admin-text-muted);">${u.email}</div>
            </td>
            <td>
              <span class="status-pill ${isSuper ? 'success' : 'warning'}">
                ${u.role}
              </span>
            </td>
            <td style="font-size: 0.8rem; font-family: var(--font-mono);">
              ${isSuper ? 'ALL PERMISSIONS' : `
                Posts: ${u.canManagePosts ? '✓' : '✗'} | Certs: ${u.canManageCertificates ? '✓' : '✗'} | Pay: ${u.canManagePayments ? '✓' : '✗'}
              `}
            </td>
            <td style="text-align: right;">
              ${u.id !== currentUserId ? `
                <button onclick="deleteUser('${u.id}', '${u.email}')" class="admin-btn admin-btn-danger" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">
                  Revoke User
                </button>
              ` : `<span style="font-size: 0.75rem; color: var(--admin-text-muted); font-family: var(--font-mono);">CURRENT SESSION</span>`}
            </td>
          </tr>
        `;
      });

      wrap.innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>User / Identifier</th>
              <th>Role</th>
              <th>Permission Flags</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    async function deleteUser(id, email) {
      if (!confirm(`Are you sure you want to revoke credentials for ${email}?`)) return;
      try {
        const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || 'Failed to revoke user');
        }
        usersList = usersList.filter(u => u.id !== id);
        renderUsersTable();
        showToast(`User ${email} revoked successfully`, 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) throw new Error('Failed to load user list');
        usersList = await res.json();
        renderUsersTable();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAdminPage((user) => {
        currentUserId = user.id;
        if (user.role !== 'SUPER_ADMIN') {
          window.location.href = '/admin.html';
          return;
        }
        loadUsers();

        document.getElementById('add-user-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('add-name').value;
          const email = document.getElementById('add-email').value;
          const password = document.getElementById('add-password').value;
          const role = document.getElementById('add-role').value;
          const canManagePosts = document.getElementById('add-posts').checked;
          const canManageCertificates = document.getElementById('add-certs').checked;
          const canManagePayments = document.getElementById('add-payments').checked;

          try {
            const res = await fetch('/api/admin/users', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, password, role, canManagePosts, canManageCertificates, canManagePayments })
            });

            if (!res.ok) {
              const data = await res.json();
              throw new Error(data.error || 'Failed to provision sub-admin');
            }

            const newUser = await res.json();
            usersList.unshift(newUser);
            renderUsersTable();
            toggleAddModal(false);
            showToast(`User ${email} provisioned successfully!`, 'success');
            document.getElementById('add-user-form').reset();
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      });
    });
  </script>
                
</body>
</html>
